name: TrustAI
description: >-
  TrustAI (trytrust.ai) is a San Francisco-based Y Combinator Summer 2026
  company founded in 2026 by Hannah Chung and Medha Venkatapathy that provides
  continuous compliance, governance, and risk assessment for AI agents
  operating on sensitive enterprise systems, with an initial focus on ERP
  agents such as SAP Joule. It maps what every agent can reach, then runs
  evaluations across six domains - data privacy, hallucinations and grounding,
  permission compliance, robustness at scale, accountability, and security -
  including adversarial pentests and prompt-injection red-teaming, and maps
  every risk to controls like SOX, ITGC, ISO 27001, GxP, and the EU AI Act for
  audit-ready reporting. The company does not currently publish a public
  developer API, docs, or SDKs. This profile was added to the API Evangelist
  network as a portfolio-lead stub.
